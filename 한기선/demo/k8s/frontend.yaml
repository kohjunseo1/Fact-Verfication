apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - {name: files, mountPath: /usr/share/nginx/html/index.html, subPath: index.html}
            - {name: files, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf}
      volumes:
        - name: files
          configMap: {name: frontend-files}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports:
    - port: 80
