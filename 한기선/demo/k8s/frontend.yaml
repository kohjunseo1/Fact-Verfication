apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            # 호스트 폴더를 그대로 연다: index.html을 저장하면 새로고침만으로 반영된다
            - {name: html, mountPath: /usr/share/nginx/html, readOnly: true}
            - {name: files, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf}
      volumes:
        - name: files
          configMap: {name: frontend-files}
        # ponytail: 로컬 VM 마운트 폴더. 클라우드 클러스터에서는 index.html도 ConfigMap이나 이미지에 넣는다
        - name: html
          hostPath: {path: /mnt/fv/demo/frontend, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports:
    - port: 80
