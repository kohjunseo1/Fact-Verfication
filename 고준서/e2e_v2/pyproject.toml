[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hover-e2e-v2"
version = "0.1.0"
description = "Leakage-safe, resumable HoVer fact verification pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = [
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
  "numpy>=1.26,<3",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "stanza>=1.8,<2",
  "transformers>=4.46,<5",
]
test = ["pytest>=8,<10"]

[project.scripts]
hover-e2e = "hover_e2e.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
